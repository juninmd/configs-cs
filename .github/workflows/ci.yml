name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Linter (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy configcheck
      - name: Security scan (bandit)
        run: bandit -r configcheck -q
      - name: Validate config files
        run: python -m configcheck .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Dependency vulnerability check
        run: pip-audit
      - name: Run Tests
        run: pytest --cov=configcheck --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=80 --junitxml=pytest-report.xml
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            pytest-report.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Package config bundle
        id: package
        run: |
          mkdir -p dist
          version="1.0.${GITHUB_RUN_NUMBER}"
          short_sha="${GITHUB_SHA:0:7}"
          tar -czf "dist/configs-cs-${version}-${short_sha}.tar.gz" *.cfg
          printf 'version=%s\ncommit=%s\nbranch=%s\n' \
            "$version" "$GITHUB_SHA" "${{ github.ref_name }}" > dist/manifest.txt
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: configs-cs-bundle
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: configs-cs-bundle
          path: dist
      - name: Health check released bundle
        run: |
          bundle=$(ls dist/*.tar.gz)
          test -f "$bundle"
          tar -tzf "$bundle" > /tmp/released.txt
          for file in CSR.cfg fallen.cfg treino.cfg user.cfg; do
            grep -qx "$file" /tmp/released.txt
          done
          echo "health check passed for $(basename "$bundle")"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-v${{ needs.build.outputs.version }}
          name: Config pack v${{ needs.build.outputs.version }}
          body: |
            Automated CI/CD release of configs-cs.

            - Version: v${{ needs.build.outputs.version }}
            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.run_id }}
          files: dist/*
          prerelease: true

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, build, deploy]
    if: failure()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Send failure notification
        if: env.SLACK_WEBHOOK != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CI/CD pipeline failed for configs-cs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK"
