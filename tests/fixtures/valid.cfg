// Sample valid Source engine config used by the test suite.

unbindall
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "w" "+forward; +jump"

// A comment with an embedded URL that must stay intact.
alias test_alias "say http://example.com/path"

cl_crosshaircolor "1"
cl_crosshairgap "-2"
con_enable ""

sensitivity "2.5"
@panorama_debug_overlay_opacity "0.8"
